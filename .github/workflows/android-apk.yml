name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'apps/pwa/**'
      - 'packages/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save lightningcss-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu @rollup/rollup-linux-x64-gnu

      - name: Build PWA bundle
        env:
          VITE_SUPABASE_URL: https://yozgllaurzquwtwbxcfq.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_ox_C92kY1pA-J747G-7ocQ_snKblnUz
        run: npm --workspace @vault/pwa run build

      - name: Sync Capacitor Android project
        working-directory: apps/pwa
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: apps/pwa/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare Pass-Vault.apk
        run: cp apps/pwa/android/app/build/outputs/apk/debug/app-debug.apk Pass-Vault.apk

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pass-Vault-APK
          path: Pass-Vault.apk

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Pass-Vault Android APK
          body: Automated Android APK build wrapping the Pass-Vault PWA.
          files: Pass-Vault.apk
